[workspace]
resolver = "3"
members = ["crates/colet-core", "crates/colet"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
gpui-kit = "=0.10.0"
# Kept on the version gpui's Windows backend uses, so Colet shares its copy
# (gpui-base and gpui-component still pull in an older windows of their own).
windows = "0.62"
windows-core = "0.62"

# gpui's Windows backend, patched: the pointer leaving the window clears what it hovered (see
# `send_pointer_left` in its events.rs). On moving gpui-kit to a release with another gpui-pre-windows,
# copy that version in afresh and carry the patch over, or cargo warns the patch went unused and drops it.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
